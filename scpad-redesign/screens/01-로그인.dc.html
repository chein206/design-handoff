<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;font-family:'Pretendard',-apple-system,sans-serif;background:#EDEEF1;color:#1A1C20;}
    a{color:#E4002B;text-decoration:none;}
    a:hover{color:#C10024;}
    input,select,button{font-family:inherit;}
    input::placeholder{color:#AAB1BD;}
  </style>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;">

  <!-- ===== LEFT BRAND PANEL ===== -->
  <div style="width:46%;max-width:620px;background:#1E2128;color:#fff;padding:56px 60px;display:flex;flex-direction:column;position:relative;overflow:hidden;">
    <div style="font-size:30px;font-weight:800;letter-spacing:.02em;">BYD <span style="color:#E4002B;">SCPAD</span></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;max-width:400px;">
      <div style="font-size:12px;font-weight:700;color:#E4002B;letter-spacing:.14em;">SALES CONSOLE</div>
      <div style="font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin-top:16px;">딜러 전용<br>견적 · 고객관리 시스템</div>
      <div style="font-size:14.5px;color:#9BA2AD;margin-top:18px;line-height:1.7;">차량 견적부터 보조금·금융 계산, 고객 파이프라인까지 한 곳에서. 현장에서는 모바일로 이어서 관리하세요.</div>
      <div style="margin-top:34px;display:flex;gap:28px;">
        <div><div style="font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;">43</div><div style="font-size:12px;color:#6C7381;font-weight:500;margin-top:2px;">저장 견적</div></div>
        <div style="width:1px;background:#2B2F38;"></div>
        <div><div style="font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;">10</div><div style="font-size:12px;color:#6C7381;font-weight:500;margin-top:2px;">관리 고객</div></div>
      </div>
    </div>
    <div style="font-size:11.5px;color:#565C68;line-height:1.7;">에스씨피에이디(SCPAD) · 사업자등록번호 000-00-00000<br>서울특별시 강남구 테헤란로 000 · 010-0000-0000</div>
    <div style="position:absolute;right:-80px;bottom:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(228,0,43,.16),transparent 70%);"></div>
  </div>

  <!-- ===== RIGHT FORM ===== -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px;">
    <div style="width:100%;max-width:388px;">
      <div style="font-size:12px;font-weight:700;color:#E4002B;letter-spacing:.12em;">WELCOME BACK</div>
      <div style="font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:10px;">계정에<br>로그인하세요</div>

      <div style="margin-top:24px;background:#fff;border:1px solid #EAECEF;border-radius:14px;padding:8px 18px;box-shadow:0 1px 3px rgba(16,24,40,.04);">
        <div style="padding:13px 0;border-bottom:1px solid #F1F2F4;">
          <div style="font-size:11px;font-weight:700;color:#9AA0AB;letter-spacing:.04em;">이메일</div>
          <input placeholder="아이디@dtnetworks.co.kr" style="width:100%;border:none;background:transparent;font-size:14.5px;outline:none;padding:5px 0 0;"/>
        </div>
        <div style="padding:13px 0;">
          <div style="font-size:11px;font-weight:700;color:#9AA0AB;letter-spacing:.04em;">비밀번호</div>
          <input type="password" placeholder="비밀번호 입력" style="width:100%;border:none;background:transparent;font-size:14.5px;outline:none;padding:5px 0 0;"/>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#6B7280;"><span style="width:17px;height:17px;border:1.5px solid #CFD4DC;border-radius:5px;background:#fff;display:inline-block;"></span>아이디 저장</label>
        <a href="#" style="font-size:13px;color:#8A93A0;" style-hover="color:#4B5563;">비밀번호 찾기</a>
      </div>

      <button style="width:100%;margin-top:22px;padding:14px;border:none;background:#E4002B;color:#fff;font-size:15px;font-weight:700;border-radius:11px;cursor:pointer;" style-hover="background:#C10024;">로그인</button>
      <button style="width:100%;margin-top:12px;padding:12px 14px;border:1px solid #E1E4EA;background:#fff;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;" style-hover="background:#F7F8FA;">
        <span style="width:38px;height:38px;border-radius:9px;background:#FAFBFC;border:1px solid #E4E7EC;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2128" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M20 20h.01M17 20h.01M20 17h.01"/></svg></span>
        <span style="flex:1;"><span style="display:block;font-size:13px;font-weight:700;color:#1A1C20;">모바일 앱으로 설치</span><span style="display:block;font-size:11.5px;color:#8A93A0;margin-top:1px;">홈 화면에 추가 · 설치 가이드 보기</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C0C5CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <div style="text-align:center;margin-top:26px;font-size:11.5px;color:#AAB1BD;">
        <a href="#" style="color:#AAB1BD;" style-hover="color:#6B7280;">이용약관</a>
        <span style="margin:0 8px;">·</span>
        <a href="#" style="color:#AAB1BD;" style-hover="color:#6B7280;">개인정보처리방침</a>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
