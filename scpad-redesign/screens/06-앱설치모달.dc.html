<body>
<x-dc>

  <style>

<div style="min-height:100vh;width:100%;background:rgba(20,22,26,.55);display:flex;align-items:center;justify-content:center;padding:24px;">

      <div style="width:40px;height:40px;border-radius:11px;background:#1E2128;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
      </div>
      <div style="flex:1;min-width:0;">

        <div style="flex:1;min-width:0;display:flex;align-items:center;padding:0 14px;background:#F7F8FA;border:1px solid #E4E7EC;border-radius:10px;font-size:14px;font-weight:600;color:#1A1C20;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">scpad.vercel.app/bydcrm</div>

          복사

            <rect x="1" y="13" width="1" height="1"/><rect x="5" y="13" width="1" height="1"/><rect x="9" y="13" width="1" height="1"/><rect x="12" y="13" width="1" height="1"/><rect x="16" y="13" width="1" height="1"/><rect x="19" y="13" width="1" height="1"/><rect x="24" y="13" width="1" height="1"/><rect x="28" y="13" width="1" height="1"/>
            <rect x="3" y="15" width="1" height="1"/><rect x="6" y="15" width="1" height="1"/><rect x="11" y="15" width="1" height="1"/><rect x="14" y="15" width="1" height="1"/><rect x="17" y="15" width="1" height="1"/><rect x="21" y="15" width="1" height="1"/><rect x="23" y="15" width="1" height="1"/><rect x="26" y="15" width="1" height="1"/>

        </div>
        <div style="padding:12px 15px;display:flex;flex-direction:column;gap:11px;">
          <div style="display:flex;align-items:center;gap:11px;"><span style="width:20px;height:20px;border-radius:50%;background:#1E2128;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">1</span><span style="font-size:13px;color:#3E4757;">Safari에서 위 주소로 접속</span></div>
          <div style="display:flex;align-items:center;gap:11px;"><span style="width:20px;height:20px;border-radius:50%;background:#1E2128;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">2</span><span style="font-size:13px;color:#3E4757;">하단 <b style="font-weight:700;color:#1A1C20;">공유 버튼</b> 탭</span></div>
          <div style="display:flex;align-items:center;gap:11px;"><span style="width:20px;height:20px;border-radius:50%;background:#1E2128;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">3</span><span style="font-size:13px;color:#3E4757;"><b style="font-weight:700;color:#1A1C20;">홈 화면에 추가</b> 선택</span></div>
        </div>
      </div>

      <div style="margin-top:10px;border:1px solid #E4E7EC;border-radius:13px;overflow:hidden;">
        <div style="display:flex;align-items:center;gap:8px;padding:11px 15px;background:#FAFBFC;border-bottom:1px solid #EEF0F2;">

        </div>
        <div style="padding:12px 15px;display:flex;flex-direction:column;gap:11px;">
          <div style="display:flex;align-items:center;gap:11px;"><span style="width:20px;height:20px;border-radius:50%;background:#1E2128;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">1</span><span style="font-size:13px;color:#3E4757;">Chrome에서 위 주소로 접속</span></div>
          <div style="display:flex;align-items:center;gap:11px;"><span style="width:20px;height:20px;border-radius:50%;background:#1E2128;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">2</span><span style="font-size:13px;color:#3E4757;">우상단 메뉴 → <b style="font-weight:700;color:#1A1C20;">앱 설치</b></span></div>
          <div style="display:flex;align-items:center;gap:11px;"><span style="width:20px;height:20px;border-radius:50%;background:#1E2128;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">3</span><span style="font-size:13px;color:#3E4757;">홈 화면에서 <b style="font-weight:700;color:#1A1C20;">SCPAD 실행</b></span></div>
