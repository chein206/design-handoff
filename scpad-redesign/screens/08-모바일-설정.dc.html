<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<body>
<x-dc>

<div style="min-height:100vh;width:100%;background:#D8DBE1;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:390px;height:830px;background:#000;border-radius:44px;padding:11px;box-shadow:0 30px 70px rgba(16,24,40,.35);">
    <div style="width:100%;height:100%;background:#F3F4F6;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;position:relative;">

      <!-- status bar -->

        <span style="font-size:14px;font-weight:700;">9:41</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <svg width="17" height="12" viewBox="0 0 18 12" fill="#1A1C20"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>

            <button style="padding:8px 15px;border:none;background:#E4002B;color:#fff;font-size:12.5px;font-weight:700;border-radius:9px;">업그레이드</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:14px;">
            <div style="flex:1;background:#F7F8FA;border-radius:10px;padding:10px;text-align:center;"><div style="font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;">30</div><div style="font-size:10.5px;color:#8A93A0;font-weight:600;margin-top:1px;">활성 고객</div></div>

        <div style="background:#fff;border:1px solid #EAECEF;border-radius:16px;overflow:hidden;">

            <div style="flex:1;"><div style="font-size:14px;font-weight:600;">알리고 연동</div><div style="font-size:11.5px;color:#9AA0AB;margin-top:2px;">단체문자 유료 발송</div></div>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C0C5CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>

        <div style="background:#fff;border:1px solid #EAECEF;border-radius:16px;overflow:hidden;">
          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F1F2F4;cursor:pointer;">

          <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #F1F2F4;cursor:pointer;">

        </div>

        <div style="text-align:center;font-size:11px;color:#B4BAC3;margin-top:22px;">SCPAD v1.0</div>
      </div>

      <!-- bottom tab bar -->
      <div style="flex-shrink:0;background:#fff;border-top:1px solid #EAECEF;padding:9px 8px 22px;display:grid;grid-template-columns:repeat(5,1fr);">
